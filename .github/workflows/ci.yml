name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86 build
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/.cache/dotnet
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      NUGET_PACKAGES: ${{ github.workspace }}/.cache/dotnet/.nuget/packages
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore AstraMcp.sln --locked-mode
      - name: Publish self-contained Windows x86 build
        run: dotnet publish src/Mcp/Mcp.csproj -c Release -r win-x86 --self-contained true -o publish/win-x86 -p:RestoreLockedMode=true
      - name: Prepare distributable configuration and instructions
        run: |
          $path = 'publish/win-x86/config.json'
          $configuration = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $configuration.Astra.ProfileReady = $false
          $configuration | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $path -Encoding utf8
          New-Item -ItemType Directory -Path publish/win-x86/scripts -Force | Out-Null
          Copy-Item -LiteralPath scripts/configure-astra-profile.ps1 -Destination publish/win-x86/scripts/
          Copy-Item -LiteralPath docs/releases/INSTALL.md -Destination publish/win-x86/README.md
      - name: Upload Windows x86 build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AstraMcp-win-x86
          path: publish/win-x86/
          if-no-files-found: error
          retention-days: 14

  release-tests:
    name: Verify release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/tests.yml

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, release-tests]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AstraMcp-win-x86
          path: dist/app
      - name: Package and publish release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.VersionPrefix
          if ($env:RELEASE_TAG -cne "v$version") { throw 'The release tag must match VersionPrefix.' }
          $notes = "docs/releases/$($env:RELEASE_TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes are missing.' }
          $archive = "dist/AstraMcp-win-x86-$($env:RELEASE_TAG).zip"
          Compress-Archive -Path dist/app/* -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          gh release create $env:RELEASE_TAG $archive "$archive.sha256" --verify-tag --title "Astra MCP $($env:RELEASE_TAG)" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
